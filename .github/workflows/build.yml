name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk SnackSOS.apk
      - uses: actions/upload-artifact@v4
        with: { name: SnackSOS, path: SnackSOS.apk }
      - name: Publish release
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest SnackSOS.apk --title "Snack SOS" --notes "Tap SnackSOS.apk to download and install."
